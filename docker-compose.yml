version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chronicle_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chronicle
      POSTGRES_PASSWORD: chronicle_dev_password
      POSTGRES_DB: chronicle
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chronicle']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chronicle_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chronicle_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://chronicle:chronicle_dev_password@postgres:5432/chronicle
      REDIS_URL: redis://redis:6379
    ports:
      - '3000:3000'
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/src:/app/src
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
